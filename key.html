<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypingFlow Pro | Custom Challenges</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #323437;
            --main-color: #e2b714;
            --sub-color: #646669;
            --text-color: #d1d0c5;
            --error-color: #ca4754;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s;
        }

        .container { width: 90%; max-width: 900px; position: relative; }

        /* Configuration Bar */
        #config-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 8px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .time-opt {
            color: var(--sub-color);
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            padding: 2px 8px;
        }

        .time-opt:hover { color: var(--text-color); }
        .time-opt.active { color: var(--main-color); font-weight: bold; }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .timer { font-size: 2.5rem; font-weight: bold; color: var(--main-color); min-width: 80px;}

        #type-area {
            font-size: 1.8rem;
            line-height: 1.5;
            height: 140px;
            overflow: hidden;
            position: relative;
            margin: 2rem 0;
            word-spacing: 0.2em;
            outline: none;
        }

        .char { color: var(--sub-color); position: relative; }
        .correct { color: var(--text-color); }
        .incorrect { color: var(--error-color); background: rgba(202, 71, 84, 0.2); border-radius: 2px; }
        
        .current { color: var(--text-color); }
        .current::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 3px;
            background: var(--main-color);
        }

        #hidden-input { opacity: 0; position: absolute; z-index: -1; }

        .btn {
            background: #2c2e31;
            border: none;
            color: var(--sub-color);
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
            transition: 0.2s;
        }

        .btn:hover { background: var(--main-color); color: black; }

        /* Overlay */
        #results-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 30, 32, 0.98);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal { width: 85%; max-width: 800px; text-align: center; }
        .stat-grid { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .stat-val { font-size: 2.5rem; color: var(--main-color); display: block; }
        .stat-label { color: var(--sub-color); font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div id="config-bar">
        <span style="color:var(--sub-color); font-size: 0.8rem; margin-right: 10px; align-self: center;">TIME:</span>
        <div class="time-opt" onclick="setTime(15)">15s</div>
        <div class="time-opt active" onclick="setTime(30)">30s</div>
        <div class="time-opt" onclick="setTime(60)">60s</div>
    </div>

    <div id="header">
        <div class="timer" id="timer">30</div>
        <div style="text-align: right">
            <span id="best-display" style="color: var(--sub-color); font-size: 0.8rem;">Best: 0 WPM</span>
        </div>
    </div>

    <div id="type-area"></div>

    <input type="text" id="hidden-input" autofocus autocomplete="off">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="btn" onclick="resetGame()">Restart (Esc)</button>
        <div style="color: var(--sub-color); font-size: 0.8rem;">Click text or press any key to focus</div>
    </div>
</div>

<div id="results-overlay">
    <div class="modal">
        <div class="stat-grid">
            <div><span id="res-wpm" class="stat-val">0</span><span class="stat-label">wpm</span></div>
            <div><span id="res-acc" class="stat-val">0</span><span class="stat-label">accuracy</span></div>
        </div>
        <canvas id="wpmChart"></canvas>
        <br>
        <button class="btn" onclick="closeModal()">Try Again</button>
    </div>
</div>

<script>
    const typeArea = document.getElementById('type-area');
    const input = document.getElementById('hidden-input');
    const timerDisplay = document.getElementById('timer');
    const resultsOverlay = document.getElementById('results-overlay');

    let targetText = "";
    let currentIndex = 0;
    let startTime = null;
    let errors = 0;
    let selectedDuration = 30;
    let timeLeft = 30;
    let timerInterval = null;
    let wpmHistory = [];
    let chartInstance = null;

    // Load High Score
    function updateBestDisplay() {
        document.getElementById('best-display').innerText = `Best: ${localStorage.getItem('bestWPM') || 0} WPM`;
    }
    updateBestDisplay();

    function setTime(seconds) {
        if (startTime) return; // Prevent changing during test
        selectedDuration = seconds;
        timeLeft = seconds;
        timerDisplay.innerText = seconds;
        
        document.querySelectorAll('.time-opt').forEach(opt => {
            opt.classList.toggle('active', parseInt(opt.innerText) === seconds);
        });
        resetGame();
    }

    function generateText() {
        const chars = "eaitnslrou";
        let words = [];
        for (let i = 0; i < 150; i++) {
            let word = "";
            let len = Math.floor(Math.random() * 4) + 3;
            for (let j = 0; j < len; j++) word += chars.charAt(Math.floor(Math.random() * chars.length));
            words.push(word);
        }
        return words.join(" ");
    }

    function renderText() {
        targetText = generateText();
        typeArea.innerHTML = targetText.split('').map(char => `<span class="char">${char}</span>`).join('');
        updateCursor();
    }

    function updateCursor() {
        const spans = typeArea.querySelectorAll('span');
        spans.forEach(s => s.classList.remove('current'));
        if (spans[currentIndex]) {
            spans[currentIndex].classList.add('current');
            // Smooth vertical scrolling
            const areaRect = typeArea.getBoundingClientRect();
            const charRect = spans[currentIndex].getBoundingClientRect();
            if (charRect.bottom > areaRect.bottom) {
                typeArea.scrollTop += 40;
            }
        }
    }

    input.addEventListener('input', () => {
        if (!startTime && input.value !== "") startTest();
        if (!startTime) return;

        const spans = typeArea.querySelectorAll('span');
        const lastChar = input.value[input.value.length - 1];

        if (lastChar === targetText[currentIndex]) {
            spans[currentIndex].classList.add('correct');
        } else {
            spans[currentIndex].classList.add('incorrect');
            errors++;
        }

        currentIndex++;
        input.value = ""; 
        updateCursor();
    });

    function startTest() {
        startTime = new Date();
        timerInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            wpmHistory.push(calculateWPM());

            if (timeLeft <= 0) finishGame();
        }, 1000);
    }

    function calculateWPM() {
        if (!startTime) return 0;
        const timeElapsed = (new Date() - startTime) / 60000;
        const wpm = Math.round((currentIndex / 5) / timeElapsed);
        return wpm;
    }

    function finishGame() {
        clearInterval(timerInterval);
        const finalWpm = calculateWPM();
        const finalAcc = Math.max(0, Math.round(((currentIndex - errors) / currentIndex) * 100));
        
        // High Score
        const best = localStorage.getItem('bestWPM') || 0;
        if (finalWpm > best) {
            localStorage.setItem('bestWPM', finalWpm);
            updateBestDisplay();
        }

        document.getElementById('res-wpm').innerText = finalWpm;
        document.getElementById('res-acc').innerText = finalAcc + "%";
        
        resultsOverlay.style.display = 'flex';
        showChart();
    }

    function showChart() {
        const ctx = document.getElementById('wpmChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: wpmHistory.map((_, i) => i + 1),
                datasets: [{
                    label: 'WPM',
                    data: wpmHistory,
                    borderColor: '#e2b714',
                    backgroundColor: 'rgba(226, 183, 20, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 2
                }]
            },
            options: { 
                responsive: true,
                scales: { 
                    y: { beginAtZero: true, grid: { color: '#444' } },
                    x: { display: true, grid: { display: false }, title: { display: true, text: 'Seconds', color: '#646669' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function resetGame() {
        clearInterval(timerInterval);
        currentIndex = 0;
        startTime = null;
        errors = 0;
        timeLeft = selectedDuration;
        wpmHistory = [];
        timerDisplay.innerText = selectedDuration;
        typeArea.scrollTop = 0;
        renderText();
        input.value = "";
        input.focus();
    }

    function closeModal() {
        resultsOverlay.style.display = 'none';
        resetGame();
    }

    window.addEventListener('keydown', (e) => { 
        if (e.key === "Escape") resetGame(); 
        input.focus(); 
    });
    document.addEventListener('click', () => input.focus());

    renderText();
</script>

</body>
</html>
